<!DOCTYPE html>
<html>
<head>
  <title>Web Page Summarizer</title>
  <style>
    body { width: 300px; padding: 10px; font-family: Arial, sans-serif; }
    button { margin-top: 10px; padding: 5px 10px; }
    #summary { margin-top: 10px; white-space: pre-wrap; }
    #query {
      width: 100%; 
    }
    .loading { display: none; }
    .section {
      /* padding: 10px; */
      padding-bottom: 10px;
    }
    .section.summary {
      margin-bottom: 10px;
      border-bottom: 1px solid #1f1f1f;
    }
    .response {
      background-color: #f1f1f1; 
      border-radius: 5px; 
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
      border-bottom: 1px dotted #1f1f1f;
    }
    .credit {
      display: inline-block;
      margin-top: 20px;
      font-size: 12px;
      color: #000;
    }
    .credit:visited {
      color: #000;
    }
    .credit:hover {
      color: #666;
    }
    button {
      background-color: #fff;
      border: 0;
      box-shadow: 0px 1px 4px rgba(0, 0, 0, .1); /* Default box shadow with 0 opacity */
      transition: transform 0.3s ease, box-shadow 0.3s ease; /* Smooth transition for scaling and box shadow */
    }
    button:hover {
      transform: scale(1.1); /* Scale up by 5% on hover */
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3); /* Increase box shadow opacity on hover */
    }
  </style>
</head>
<body>
  <div class="section summary">
    <h2>Web Page AI Summarizer</h2>
    <button id="summarize">Summarize Page</button>
    <div id="summary"></div>
    <div id="loadingSummary" class="loading">Loading your summary... Please wait.</div>
  </div>

  <div class="section">
    <h2>Web Page AI Query</h2>
    <textarea id="query" placeholder="What on this webpage do you want more information about?" rows="4"></textarea>
    <button id="submit">Submit</button>
    <div id="queryResponses"></div>
    <div id="loadingQuery" class="loading">Loading your query... Please wait.</div>
  </div>
  <a class="credit" href="https://github.com/adriaanbalt" target="_blank">built by https://github.com/adriaanbalt</a>
  <script src="sidepanel.js"></script>
</body>
</html>
